<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本語 RSVP 速読リーダー</title>
<!-- BudouXライブラリの読み込み -->
<script src="https://unpkg.com/budoux/bundle/budoux-ja.min.js"></script>
<style>
:root {
--bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0;
--accent-color: #ff9800; --border-color: #333333;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
header { padding: 12px 16px; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; height: 56px; }
.title-area { font-size: 14px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
button { background-color: #2c2c2e; color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: 0.2s; }
button:active { background-color: #3a3a3c; }
button.primary { background-color: var(--accent-color); color: #000; font-weight: bold; border: none; }
main { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; padding: 20px; cursor: pointer; }
.guide-line { position: absolute; width: 2px; height: 30px; background-color: rgba(255, 152, 0, 0.4); top: 50%; transform: translateY(-50%); }
#rsvp-word { font-size: 32px; font-weight: bold; letter-spacing: 1px; text-align: center; line-height: 1.4; }
.orp { color: var(--accent-color); }
.progress-bar-container { width: 100%; height: 4px; background-color: #2c2c2e; position: absolute; bottom: 0; left: 0; }
#progress-bar { height: 100%; width: 0%; background-color: var(--accent-color); transition: width 0.1s linear; }
controls { background-color: var(--card-bg); border-top: 1px solid var(--border-color); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.btn-large { flex: 1; height: 48px; font-size: 16px; }
.slider-row { display: flex; gap: 12px; font-size: 12px; color: #aaa; }
.slider-container { display: flex; align-items: center; gap: 8px; flex: 1; }
input[type="range"] { flex: 1; accent-color: var(--accent-color); }
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
.modal.active { display: flex; }
.modal-content { background-color: var(--card-bg); padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; }
input[type="text"], textarea { width: 100%; background: #121212; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 8px; font-size: 14px; }
textarea { height: 150px; resize: none; }
#loading { display: none; font-size: 12px; color: var(--accent-color); text-align: center; font-weight: bold; }
</style>
</head>
<body>

<header>
<div class="title-area" id="doc-title">準備完了</div>
<button id="btn-open-modal">データ読込</button>
</header>

<main id="main-area">
<div class="guide-line"></div>
<div id="rsvp-word">データ読込を押してね</div>
<div class="progress-bar-container"><div id="progress-bar"></div></div>
</main>

<controls>
<div class="row">
<button id="btn-prev" class="btn-large" disabled>◀ 前の話</button>
<button id="btn-next" class="btn-large primary" disabled>次の話 ▶</button>
</div>
<div class="row">
<button id="btn-rewind">5分節 戻る</button>
<button id="btn-toggle" class="btn-large primary" style="flex:2;">再生 (Tap)</button>
<button id="btn-forward">5分節 進む</button>
</div>
<div class="slider-row">
<div class="slider-container">
<span>速度: <strong id="speed-val">500</strong></span>
<input type="range" id="slider-speed" min="200" max="1500" step="50" value="500">
</div>
<div class="slider-container">
<span>文字</span>
<input type="range" id="slider-size" min="20" max="60" step="2" value="32">
</div>
</div>
</controls>

<div class="modal" id="modal-input">
<div class="modal-content">
<h3>小説の読み込み</h3>
<input type="text" id="url-input" placeholder="https://ncode.syosetu.com/...">
<button id="btn-fetch" class="primary">URLから取得</button>
<div id="loading">通信中...（数秒お待ちください）</div>
<hr style="border-color:#333; margin: 5px 0;">
<textarea id="text-input" placeholder="ここに直接文章を貼り付けて「文章から開始」を押してね！"></textarea>
<button id="btn-start-manual" class="primary">文章から開始</button>
<button id="btn-close-modal">閉じる</button>
</div>
</div>

<script>
let state = { phrases: [], currentIndex: 0, isPlaying: false, timer: null, cpm: 500, fontSize: 32, prevUrl: '', nextUrl: '' };

const elWord = document.getElementById('rsvp-word');
const elTitle = document.getElementById('doc-title');
const elBtnToggle = document.getElementById('btn-toggle');
const elProgressBar = document.getElementById('progress-bar');
const elBtnPrev = document.getElementById('btn-prev');
const elBtnNext = document.getElementById('btn-next');
const modal = document.getElementById('modal-input');
const loadingMsg = document.getElementById('loading');

// ★ エラーに強いBudouX分割 ＋ 予備システム ★
function safeParse(text) {
try {
if (typeof budoux !== 'undefined') {
const parser = budoux.loadDefaultJapaneseParser();
return parser.parse(text);
}
} catch(e) {
console.warn("BudouXの読み込みに失敗したため、予備システムで分割します", e);
}

// BudouXが使えない場合の予備システム（句読点で分割）
let chunks = [];
let current = "";
for (let char of text) {
current += char;
if (/[。、！？\n]/.test(char)) {
chunks.push(current);
current = "";
}
}
if (current) chunks.push(current);
return chunks;
}

// ★ 完璧な句読点クリーニング処理 ★
function processTextToPhrases(text) {
if (!text) return [];

const cleanText = text.replace(/\r\n/g, '\n').replace(/\n+/g, '\n');
const rawPhrases = safeParse(cleanText);
const cleaned = [];
const marks = /^[。、」』）！？!?，,\.\n\s]+/; // 文頭に来てほしくない記号

rawPhrases.forEach(phrase => {
let current = phrase;
// 先頭の記号を前の文節にくっつける
while (true) {
const match = current.match(marks);
if (!match) break;
const m = match[0];
if (m.length === 0) break;

if (cleaned.length > 0) {
cleaned[cleaned.length - 1] += m;
} else {
cleaned.push(m);
}
current = current.slice(m.length);
}
if (current.trim().length > 0) {
cleaned.push(current);
}
});
return cleaned;
}

function loadText(text, title, prev='', next='') {
try {
stop();
state.phrases = processTextToPhrases(text);
if(state.phrases.length === 0) {
alert('文章が空っぽだよ！');
return;
}
state.currentIndex = 0; state.prevUrl = prev; state.nextUrl = next;
elTitle.innerText = title;
elBtnPrev.disabled = !prev; elBtnNext.disabled = !next;
localStorage.setItem('rsvp_text', text); localStorage.setItem('rsvp_title', title);
modal.classList.remove('active');
updateDisplay();
} catch(e) {
alert('読み込み中にエラーが起きたよ: ' + e.message);
}
}

function updateDisplay() {
if (state.phrases.length === 0) return;
if (state.currentIndex >= state.phrases.length) { state.currentIndex = state.phrases.length - 1; stop(); }

const phrase = state.phrases[state.currentIndex];
const mid = Math.floor(phrase.length / 2); // ORP計算
let html = '';
for (let i = 0; i < phrase.length; i++) {
html += (i === mid) ? `<span class="orp">${phrase[i]}</span>` : phrase[i];
}
elWord.innerHTML = html;
elProgressBar.style.width = `${((state.currentIndex + 1) / state.phrases.length) * 100}%`;
}

function play() {
if (state.phrases.length === 0) return;
state.isPlaying = true; elBtnToggle.innerText = '一時停止';
scheduleNext();
}

function stop() {
state.isPlaying = false; elBtnToggle.innerText = '再生 (Tap)';
clearTimeout(state.timer);
}

function scheduleNext() {
if (!state.isPlaying) return;
updateDisplay();

let duration = (state.phrases[state.currentIndex].length * (60 / state.cpm) * 1000);
if (/[。！？\n]/.test(state.phrases[state.currentIndex])) duration *= 1.5;

state.timer = setTimeout(() => {
if (state.currentIndex < state.phrases.length - 1) {
state.currentIndex++; scheduleNext();
} else stop();
}, duration);
}

// ★ HTML解析とURL取得（エラーメッセージ付き） ★
function parseHtmlAndLoad(htmlText, url) {
try {
const doc = new DOMParser().parseFromString(htmlText, "text/html");
let content = '', title = '', prev = '', next = '';

if (url.includes('syosetu.com')) {
content = doc.querySelector('#novel_honbun')?.innerText || '';
title = doc.querySelector('.novel_subtitle')?.innerText || doc.querySelector('.novel_title')?.innerText || '';
doc.querySelectorAll('.novel_bn').forEach(a => {
if(a.innerText.includes('前')) prev = new URL(a.getAttribute('href'), url).href;
if(a.innerText.includes('次')) next = new URL(a.getAttribute('href'), url).href;
});
} else if (url.includes('kakuyomu.jp')) {
content = doc.querySelector('.widget-episodeBody')?.innerText || doc.querySelector('.js-vertical-section')?.innerText || '';
title = doc.querySelector('.widget-episodeTitle')?.innerText || '';
const pEl = doc.querySelector('.widget-episode-nav-item--prev a');
const nEl = doc.querySelector('.widget-episode-nav-item--next a');
if(pEl) prev = new URL(pEl.getAttribute('href'), url).href;
if(nEl) next = new URL(nEl.getAttribute('href'), url).href;
}

if(content) {
loadText(content, title, prev, next);
} else {
alert('サイトから本文が見つけられなかったよ。直接コピーして貼り付けてみてね！');
}
} catch(e) {
alert('サイトの解析に失敗したよ: ' + e.message);
}
}

async function fetchNovelData(url) {
loadingMsg.style.display = 'block';
try {
const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
const res = await fetch(proxyUrl);
if (!res.ok) throw new Error('プロキシサーバーへの接続に失敗しました');
const data = await res.json();
if(!data.contents) throw new Error('データを取得できませんでした');
parseHtmlAndLoad(data.contents, url);
} catch(e) {
alert('通信エラーだよ！URLが間違っているか、セキュリティで弾かれたかもしれない: ' + e.message);
} finally {
loadingMsg.style.display = 'none';
}
}

// 初期化とイベント設定
window.addEventListener('DOMContentLoaded', () => {
try {
const savedCpm = localStorage.getItem('rsvp_cpm');
if (savedCpm) { state.cpm = parseInt(savedCpm, 10); document.getElementById('slider-speed').value = state.cpm; document.getElementById('speed-val').innerText = state.cpm; }

const params = new URLSearchParams(window.location.search);
const passedUrl = params.get('url');
if (passedUrl) {
fetchNovelData(passedUrl);
} else {
const savedText = localStorage.getItem('rsvp_text');
if (savedText) loadText(savedText, localStorage.getItem('rsvp_title') || '前回の続き');
else modal.classList.add('active'); // 最初は何もないので開く
}
} catch (e) {
console.error("初期化エラー", e);
}
});

document.getElementById('main-area').addEventListener('click', () => state.isPlaying ? stop() : play());
document.getElementById('btn-toggle').addEventListener('click', (e) => { e.stopPropagation(); state.isPlaying ? stop() : play(); });
document.getElementById('btn-rewind').addEventListener('click', () => { state.currentIndex = Math.max(0, state.currentIndex - 5); updateDisplay(); });
document.getElementById('btn-forward').addEventListener('click', () => { state.currentIndex = Math.min(state.phrases.length - 1, state.currentIndex + 5); updateDisplay(); });

document.getElementById('slider-speed').addEventListener('input', (e) => {
state.cpm = parseInt(e.target.value, 10);
document.getElementById('speed-val').innerText = state.cpm;
localStorage.setItem('rsvp_cpm', state.cpm);
});
document.getElementById('slider-size').addEventListener('input', (e) => { elWord.style.fontSize = `${e.target.value}px`; });

document.getElementById('btn-open-modal').addEventListener('click', () => { stop(); modal.classList.add('active'); });
document.getElementById('btn-close-modal').addEventListener('click', () => modal.classList.remove('active'));

// ★ 文章開始ボタン（エラーキャッチ付き） ★
document.getElementById('btn-start-manual').addEventListener('click', () => {
try {
const txt = document.getElementById('text-input').value;
if(txt) loadText(txt, '直接入力', '', '');
else alert('テキストボックスが空っぽだよ！');
} catch(e) {
alert('エラーが発生したよ: ' + e.message);
}
});

document.getElementById('btn-fetch').addEventListener('click', () => {
const u = document.getElementById('url-input').value;
if(u) fetchNovelData(u);
else alert('URLを入力してね！');
});

elBtnPrev.addEventListener('click', () => { if(state.prevUrl) window.location.href = `?url=${encodeURIComponent(state.prevUrl)}`; });
elBtnNext.addEventListener('click', () => { if(state.nextUrl) window.location.href = `?url=${encodeURIComponent(state.nextUrl)}`; });
</script>
</body>
</html>
