<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RSVP ノベルリーダー - 高速文節表示</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#131924',
                        accent: '#ff6b35',
                        accentHover: '#ff8552',
                        secondary: '#38bdf8',
                        sepiaBg: '#fbf0d9',
                        sepiaCard: '#f4e4c1',
                        sepiaText: '#433422'
                    },
                    fontFamily: {
                        gothic: ['"Zen Kaku Gothic New"', 'sans-serif'],
                        mincho: ['"Shippori Mincho"', 'serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts: Zen Kaku Gothic New, Shippori Mincho & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons for smooth mobile UI icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- BudouX Japanese Segmentation Engine CDN -->
    <script src="https://unpkg.com/budoux/bundle/budoux-ja.min.js"></script>

    <style>
        body {
            font-family: 'Zen Kaku Gothic New', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(17, 24, 39, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.5);
            border-radius: 9999px;
        }

        /* ORP Highlight Alignment Engine */
        .orp-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            word-break: keep-all;
            white-space: nowrap;
        }

        .orp-pivot {
            color: #ff6b35;
            font-weight: 800;
            text-shadow: 0 0 18px rgba(255, 107, 53, 0.5);
            transform: scale(1.12);
            display: inline-block;
            transition: transform 0.1s ease;
        }

        /* Sepia Theme ORP override */
        body.theme-sepia .orp-pivot {
            color: #d9480f;
            text-shadow: 0 0 12px rgba(217, 72, 15, 0.3);
        }

        /* Custom Input Range Thumb */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(63, 63, 70, 0.6);
            border-radius: 8px;
            height: 6px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ff6b35;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,107,53,0.5);
        }

        /* Active tab indicator */
        .tab-btn.active {
            border-bottom: 2px solid #ff6b35;
            color: #ff6b35;
        }

        /* Font Theme Classes */
        .font-mode-mincho {
            font-family: 'Shippori Mincho', serif !important;
        }
        .font-mode-gothic {
            font-family: 'Zen Kaku Gothic New', sans-serif !important;
        }
    </style>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen flex flex-col justify-between select-none overflow-x-hidden font-mode-gothic">

    <header class="w-full bg-cardbg/80 backdrop-blur-md border-b border-gray-800/80 sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-2 cursor-pointer" id="header-logo">
            <div class="w-8 h-8 rounded-lg bg-accent/20 flex items-center justify-center text-accent">
                <i class="ph-bold ph-lightning text-xl"></i>
            </div>
            <div>
                <h1 class="text-base font-extrabold tracking-wider bg-gradient-to-r from-accent to-amber-400 bg-clip-text text-transparent">
                    RSVP ノベル
                </h1>
                <p class="text-[10px] text-gray-400 font-medium">文節単位・視点固定速読リーダー</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- History Button -->
            <button id="open-history-btn" title="読書履歴" class="p-2.5 rounded-xl bg-gray-800/80 hover:bg-gray-700 text-gray-300 transition-all active:scale-95">
                <i class="ph-bold ph-clock-counter-clockwise text-lg"></i>
            </button>
            <!-- Settings Button -->
            <button id="open-settings-btn" title="表示設定" class="p-2.5 rounded-xl bg-gray-800/80 hover:bg-gray-700 text-gray-300 transition-all active:scale-95">
                <i class="ph-bold ph-sliders-horizontal text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center">

        <!-- Input Section Card -->
        <div id="input-card" class="bg-cardbg rounded-2xl p-5 border border-gray-800/80 shadow-2xl transition-all duration-300">
            <!-- Navigation Tabs -->
            <div class="flex border-b border-gray-800/80 mb-5">
                <button id="tab-url" class="tab-btn active flex-1 py-2.5 font-semibold text-center text-sm transition-colors flex items-center justify-center gap-1.5">
                    <i class="ph-bold ph-link text-base"></i> Web URL
                </button>
                <button id="tab-sample" class="tab-btn flex-1 py-2.5 font-semibold text-center text-sm text-gray-400 transition-colors flex items-center justify-center gap-1.5">
                    <i class="ph-bold ph-book-open text-base"></i> サンプル名作
                </button>
                <button id="tab-text" class="tab-btn flex-1 py-2.5 font-semibold text-center text-sm text-gray-400 transition-colors flex items-center justify-center gap-1.5">
                    <i class="ph-bold ph-textbox text-base"></i> 直接入力
                </button>
            </div>

            <!-- View 1: Web URL Input -->
            <div id="view-url" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1.5">小説エピソードURL</label>
                    <div class="relative">
                        <input type="url" id="novel-url-input" placeholder="https://ncode.syosetu.com/... または https://kakuyomu.jp/..." 
                            class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-4 py-3 pr-10 text-sm focus:outline-none focus:border-accent text-gray-100 placeholder-gray-500 transition-all">
                        <button id="clear-url-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                            <i class="ph-bold ph-x-circle text-lg"></i>
                        </button>
                    </div>
                </div>

                <div class="flex flex-wrap gap-2 pt-1">
                    <span class="text-[11px] font-semibold text-gray-400 flex items-center gap-1">
                        <i class="ph-bold ph-check-circle text-accent"></i> 対応サイト:
                    </span>
                    <span class="px-2 py-0.5 rounded-md bg-gray-800 text-[11px] text-gray-300">小説家になろう</span>
                    <span class="px-2 py-0.5 rounded-md bg-gray-800 text-[11px] text-gray-300">カクヨム</span>
                    <span class="px-2 py-0.5 rounded-md bg-gray-800 text-[11px] text-gray-300">アルファポリス</span>
                </div>

                <button id="fetch-btn" class="w-full bg-accent hover:bg-accentHover text-white font-bold py-3.5 rounded-xl shadow-lg shadow-accent/20 transition-transform active:scale-[0.98] flex items-center justify-center gap-2 mt-2">
                    <i class="ph-bold ph-download-simple text-xl"></i>
                    <span>本文を取得して読み込む</span>
                </button>
            </div>

            <!-- View 2: Sample Classics Selector -->
            <div id="view-sample" class="space-y-3 hidden">
                <p class="text-xs text-gray-400">すぐ体験できる著作権フリーの名作文学サンプルです:</p>
                <div class="grid grid-cols-1 gap-2.5">
                    <button class="sample-card p-3 rounded-xl bg-gray-900/80 hover:bg-gray-800/90 border border-gray-800 hover:border-accent/50 text-left transition-all flex items-center justify-between group" data-sample="meros">
                        <div>
                            <div class="text-sm font-bold text-gray-200 group-hover:text-accent transition-colors">走れメロス</div>
                            <div class="text-xs text-gray-400">太宰治 ・ 「メロスは激怒した。必ず、かの邪智暴虐の王を除かなければならぬと決意した...」</div>
                        </div>
                        <i class="ph-bold ph-caret-right text-gray-500 group-hover:text-accent text-lg"></i>
                    </button>
                    <button class="sample-card p-3 rounded-xl bg-gray-900/80 hover:bg-gray-800/90 border border-gray-800 hover:border-accent/50 text-left transition-all flex items-center justify-between group" data-sample="chumon">
                        <div>
                            <div class="text-sm font-bold text-gray-200 group-hover:text-accent transition-colors">注文の多い料理店</div>
                            <div class="text-xs text-gray-400">宮沢賢治 ・ 「二人の若い紳士が、すっかりイギリスの兵隊の形をして、ピカピカする鉄砲を担いで...」</div>
                        </div>
                        <i class="ph-bold ph-caret-right text-gray-500 group-hover:text-accent text-lg"></i>
                    </button>
                    <button class="sample-card p-3 rounded-xl bg-gray-900/80 hover:bg-gray-800/90 border border-gray-800 hover:border-accent/50 text-left transition-all flex items-center justify-between group" data-sample="rashomon">
                        <div>
                            <div class="text-sm font-bold text-gray-200 group-hover:text-accent transition-colors">羅生門</div>
                            <div class="text-xs text-gray-400">芥川龍之介 ・ 「ある日の暮方の事である。一人の下人が、羅生門の下で雨やみを待っていた...」</div>
                        </div>
                        <i class="ph-bold ph-caret-right text-gray-500 group-hover:text-accent text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- View 3: Direct Text View -->
            <div id="view-text" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">テキスト本文</label>
                    <textarea id="direct-text-input" rows="6" placeholder="ここに速読したい文章を貼り付けてください..."
                        class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl p-3 text-sm focus:outline-none focus:border-accent text-gray-100 placeholder-gray-500 resize-none transition-all"></textarea>
                </div>
                <button id="load-text-btn" class="w-full bg-accent hover:bg-accentHover text-white font-bold py-3.5 rounded-xl shadow-lg shadow-accent/20 transition-transform active:scale-[0.98] flex items-center justify-center gap-2">
                    <i class="ph-bold ph-play-circle text-xl"></i>
                    <span>RSVP表示を開始</span>
                </button>
            </div>

            <!-- Status Indicator -->
            <div id="status-msg" class="hidden mt-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2"></div>
        </div>

        <!-- RSVP Reader Stage (Hidden until loaded) -->
        <div id="reader-stage" class="hidden flex flex-col space-y-4 my-auto">
            
            <!-- Novel Title & Episode Banner -->
            <div class="bg-cardbg/80 border border-gray-800/80 rounded-2xl p-3.5 text-center shadow-lg relative">
                <h2 id="novel-title" class="text-xs font-semibold text-accent truncate">作品タイトル</h2>
                <h3 id="episode-title" class="text-sm font-bold text-gray-200 truncate mt-0.5">エピソード名</h3>
            </div>

            <!-- Main Display Window with Precise Center Alignment -->
            <div id="display-card" class="relative bg-cardbg rounded-2xl border border-gray-800 p-6 h-64 flex flex-col items-center justify-center shadow-2xl cursor-pointer select-none overflow-hidden group">
                
                <!-- Center Focus Alignment Guides -->
                <div class="absolute top-4 left-1/2 -translate-x-1/2 w-8 h-1 bg-accent/60 rounded-full shadow-sm"></div>
                <div class="absolute bottom-4 left-1/2 -translate-x-1/2 w-8 h-1 bg-accent/60 rounded-full shadow-sm"></div>
                <div class="absolute inset-y-0 left-1/2 w-px bg-accent/15 pointer-events-none"></div>

                <!-- Precise 3-Part ORP Word Display Container -->
                <div id="rsvp-word-display" class="orp-container text-gray-100 transition-all duration-75">
                    <div class="w-1/2 text-right pr-0.5 text-gray-300 overflow-hidden whitespace-nowrap text-ellipsis" id="orp-left">タップして</div>
                    <div class="shrink-0 text-center text-accent font-extrabold px-0.5 orp-pivot" id="orp-pivot">再</div>
                    <div class="w-1/2 text-left pl-0.5 text-gray-300 overflow-hidden whitespace-nowrap text-ellipsis" id="orp-right">生開始</div>
                </div>

                <!-- Overlay Pause Graphic Indicator -->
                <div id="pause-overlay" class="absolute inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center opacity-0 transition-opacity duration-200 pointer-events-none">
                    <i id="pause-icon" class="ph-fill ph-pause-circle text-6xl text-accent shadow-2xl"></i>
                </div>
            </div>

            <!-- Progress Info & Bar -->
            <div class="space-y-1.5 px-1">
                <div class="flex justify-between text-xs text-gray-400 font-medium">
                    <span id="progress-text">フレーズ: 0 / 0</span>
                    <span id="time-remaining">残り: --分</span>
                </div>
                <div class="w-full bg-gray-800/80 h-2.5 rounded-full overflow-hidden p-0.5">
                    <div id="progress-bar" class="bg-gradient-to-r from-accent to-amber-400 h-full rounded-full w-0 transition-all duration-150"></div>
                </div>
            </div>

            <!-- Main Reader Control Console -->
            <div class="bg-cardbg rounded-2xl p-4 border border-gray-800/80 shadow-xl flex flex-col space-y-4">
                
                <!-- Playback & Navigation Controls -->
                <div class="flex items-center justify-between gap-2">
                    <button id="prev-ep-btn" title="前の話" class="flex-1 py-3 px-3 bg-gray-800/80 hover:bg-gray-700 text-xs font-semibold rounded-xl flex items-center justify-center gap-1 transition-all active:scale-95 disabled:opacity-30 disabled:pointer-events-none">
                        <i class="ph-bold ph-caret-left text-sm"></i> 前の話
                    </button>

                    <button id="rw-btn" title="5フレーズ戻る (←)" class="p-3 bg-gray-800/80 hover:bg-gray-700 rounded-xl text-gray-200 active:scale-95 transition-all">
                        <i class="ph-bold ph-rewind text-lg"></i>
                    </button>

                    <button id="play-btn" title="再生/一時停止 (Space)" class="p-4 bg-accent hover:bg-accentHover text-white rounded-2xl active:scale-95 transition-all shadow-lg shadow-accent/30">
                        <i id="play-btn-icon" class="ph-bold ph-play text-2xl"></i>
                    </button>

                    <button id="ff-btn" title="5フレーズ進む (→)" class="p-3 bg-gray-800/80 hover:bg-gray-700 rounded-xl text-gray-200 active:scale-95 transition-all">
                        <i class="ph-bold ph-fast-forward text-lg"></i>
                    </button>

                    <button id="next-ep-btn" title="次の話" class="flex-1 py-3 px-3 bg-accent/20 hover:bg-accent/30 text-accent border border-accent/30 text-xs font-bold rounded-xl flex items-center justify-center gap-1 transition-all active:scale-95 disabled:opacity-30 disabled:pointer-events-none">
                        次の話 <i class="ph-bold ph-caret-right text-sm"></i>
                    </button>
                </div>

                <!-- Speed Bar Quick Selector -->
                <div class="flex items-center justify-between pt-2 border-t border-gray-800/60">
                    <div class="flex items-center gap-1.5 text-xs font-semibold text-gray-400">
                        <i class="ph-bold ph-gauge text-accent text-base"></i>
                        <span id="speed-label">500 CPM</span>
                    </div>
                    <div class="flex gap-1.5">
                        <button class="speed-preset py-1 px-2.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 font-semibold active:scale-95 transition-all" data-cpm="300">300</button>
                        <button class="speed-preset py-1 px-2.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 font-semibold active:scale-95 transition-all" data-cpm="500">500</button>
                        <button class="speed-preset py-1 px-2.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 font-semibold active:scale-95 transition-all" data-cpm="800">800</button>
                        <button class="speed-preset py-1 px-2.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 font-semibold active:scale-95 transition-all" data-cpm="1200">1200</button>
                    </div>
                </div>
            </div>

            <!-- Return to Input Link -->
            <button id="reset-view-btn" class="text-xs text-gray-400 hover:text-gray-200 text-center py-1.5 flex items-center justify-center gap-1 transition-colors">
                <i class="ph-bold ph-arrow-left"></i> 別のURL・テキストを入力する
            </button>
        </div>

    </main>

    <!-- Settings Drawer Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-cardbg border border-gray-800/80 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 space-y-5 shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <h3 class="text-base font-bold text-gray-100 flex items-center gap-2">
                    <i class="ph-bold ph-sliders-horizontal text-accent"></i> 読書表示設定
                </h3>
                <button id="close-settings-btn" class="p-1 text-gray-400 hover:text-gray-200">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>

            <!-- CPM Speed Slider -->
            <div class="space-y-1.5">
                <div class="flex justify-between text-xs font-semibold">
                    <span class="text-gray-400">表示速度 (CPM: 1分あたりの文字数)</span>
                    <span id="slider-speed-val" class="text-accent font-bold">500 CPM</span>
                </div>
                <input type="range" id="cpm-slider" min="100" max="2500" step="50" value="500" class="w-full">
            </div>

            <!-- Font Size Slider -->
            <div class="space-y-1.5">
                <div class="flex justify-between text-xs font-semibold">
                    <span class="text-gray-400">文字サイズ</span>
                    <span id="slider-font-val" class="text-accent font-bold">36 px</span>
                </div>
                <input type="range" id="font-slider" min="20" max="60" step="2" value="36" class="w-full">
            </div>

            <!-- Phrase Segmentation Density -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-gray-400">文節区切り強度</label>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <button id="chunk-short" class="chunk-opt py-2 rounded-xl bg-gray-800 text-gray-300 font-semibold border border-transparent">短め (単語)</button>
                    <button id="chunk-medium" class="chunk-opt py-2 rounded-xl bg-accent/20 text-accent font-semibold border border-accent/40">標準 (文節)</button>
                    <button id="chunk-long" class="chunk-opt py-2 rounded-xl bg-gray-800 text-gray-300 font-semibold border border-transparent">長め (長文節)</button>
                </div>
            </div>

            <!-- Font Family Toggle -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-gray-400">フォントスタイル</label>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button id="font-gothic-btn" class="py-2 rounded-xl bg-accent/20 text-accent font-semibold border border-accent/40">ゴシック体 (Zen Kaku)</button>
                    <button id="font-mincho-btn" class="py-2 rounded-xl bg-gray-800 text-gray-300 font-semibold border border-transparent font-mincho">明朝体 (Shippori)</button>
                </div>
            </div>

            <button id="save-settings-btn" class="w-full bg-accent hover:bg-accentHover text-white font-bold py-3 rounded-xl shadow-lg mt-2 transition-transform active:scale-95">
                設定を適用する
            </button>
        </div>
    </div>

    <!-- Reading History Drawer Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-cardbg border border-gray-800/80 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 space-y-4 shadow-2xl max-h-[80vh] flex flex-col">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3 shrink-0">
                <h3 class="text-base font-bold text-gray-100 flex items-center gap-2">
                    <i class="ph-bold ph-clock-counter-clockwise text-accent"></i> 読書履歴
                </h3>
                <button id="close-history-btn" class="p-1 text-gray-400 hover:text-gray-200">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>

            <div id="history-list" class="flex-1 overflow-y-auto space-y-2 pr-1 my-2">
                <!-- Dynamic history cards inserted here -->
            </div>

            <button id="clear-history-btn" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-xs text-gray-400 hover:text-gray-200 font-semibold rounded-xl transition-colors shrink-0">
                履歴をクリア
            </button>
        </div>
    </div>

    <!-- Custom Modal Dialog (Alert/Confirm Replacement) -->
    <div id="custom-dialog" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardbg border border-gray-800 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl text-center">
            <i id="dialog-icon" class="ph-bold ph-info text-4xl text-accent mx-auto"></i>
            <h4 id="dialog-title" class="text-base font-bold text-gray-100">通知</h4>
            <p id="dialog-msg" class="text-xs text-gray-300 leading-relaxed"></p>
            <div id="dialog-buttons" class="flex gap-2 pt-2">
                <button id="dialog-cancel-btn" class="flex-1 py-2.5 bg-gray-800 hover:bg-gray-700 text-xs font-semibold rounded-xl text-gray-300 hidden">キャンセル</button>
                <button id="dialog-confirm-btn" class="flex-1 py-2.5 bg-accent hover:bg-accentHover text-xs font-bold rounded-xl text-white">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Sample Classics Library Data
        const SAMPLE_TEXTS = {
            meros: {
                title: "走れメロス",
                episode: "本文",

        function loadStoredSettings() {
            const savedCpm = localStorage.getItem('rsvp_cpm');
            const savedFont = localStorage.getItem('rsvp_font');
            const savedUrl = localStorage.getItem('rsvp_last_url');
            const savedHistory = localStorage.getItem('rsvp_history');
            const savedFontFamily = localStorage.getItem('rsvp_font_family');

            if (savedCpm) state.cpm = parseInt(savedCpm, 10);
            if (savedFont) state.fontSize = parseInt(savedFont, 10);
            if (savedUrl) elements.novelUrlInput.value = savedUrl;
            if (savedFontFamily) state.fontFamily = savedFontFamily;
            if (savedHistory) {
                try { state.history = JSON.parse(savedHistory); } catch (e) {}
            }

            updateSettingsUI();
        }

        function updateSettingsUI() {
            elements.cpmSlider.value = state.cpm;
            elements.fontSlider.value = state.fontSize;
            elements.sliderSpeedVal.textContent = `${state.cpm} CPM`;
            elements.sliderFontVal.textContent = `${state.fontSize} px`;
            elements.speedLabel.textContent = `${state.cpm} CPM`;
            
            document.getElementById('rsvp-word-display').style.fontSize = `${state.fontSize}px`;

            if (state.fontFamily === 'mincho') {
                document.body.classList.add('font-mode-mincho');
                document.body.classList.remove('font-mode-gothic');
                elements.fontMinchoBtn.classList.add('bg-accent/20', 'text-accent', 'border-accent/40');
                elements.fontMinchoBtn.classList.remove('bg-gray-800', 'text-gray-300', 'border-transparent');
                elements.fontGothicBtn.classList.remove('bg-accent/20', 'text-accent', 'border-accent/40');
                elements.fontGothicBtn.classList.add('bg-gray-800', 'text-gray-300', 'border-transparent');
            } else {
                document.body.classList.add('font-mode-gothic');
                document.body.classList.remove('font-mode-mincho');
                elements.fontGothicBtn.classList.add('bg-accent/20', 'text-accent', 'border-accent/40');
                elements.fontGothicBtn.classList.remove('bg-gray-800', 'text-gray-300', 'border-transparent');
                elements.fontMinchoBtn.classList.remove('bg-accent/20', 'text-accent', 'border-accent/40');
                elements.fontMinchoBtn.classList.add('bg-gray-800', 'text-gray-300', 'border-transparent');
            }
        }

        function setupEventListeners() {
            // Tab Switchers
            elements.tabUrl.addEventListener('click', () => switchTab('url'));
            elements.tabSample.addEventListener('click', () => switchTab('sample'));
            elements.tabText.addEventListener('click', () => switchTab('text'));

            elements.headerLogo.addEventListener('click', resetToInput);

            elements.clearUrlBtn.addEventListener('click', () => {
                elements.novelUrlInput.value = '';
                elements.novelUrlInput.focus();
            });

            // Action Triggers
            elements.fetchBtn.addEventListener('click', () => handleUrlFetch());
            elements.loadTextBtn.addEventListener('click', () => handleDirectTextLoad());

            // Sample Cards Click
            document.querySelectorAll('.sample-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    const sampleKey = e.currentTarget.dataset.sample;
                    if (SAMPLE_TEXTS[sampleKey]) {
                        const sample = SAMPLE_TEXTS[sampleKey];
                        state.novelTitle = sample.title;
                        state.episodeTitle = sample.episode;
                        state.prevUrl = null;
                        state.nextUrl = null;
                        processTextToRSVP(sample.text);
                    }
                });
            });

            // Playback Controls
            elements.displayCard.addEventListener('click', togglePlayPause);
            elements.playBtn.addEventListener('click', togglePlayPause);
            elements.rwBtn.addEventListener('click', () => skipPhrases(-5));
            elements.ffBtn.addEventListener('click', () => skipPhrases(5));

            elements.prevEpBtn.addEventListener('click', () => navigateEpisode(state.prevUrl));
            elements.nextEpBtn.addEventListener('click', () => navigateEpisode(state.nextUrl));

            elements.resetViewBtn.addEventListener('click', resetToInput);

            // Speed Presets
            document.querySelectorAll('.speed-preset').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.cpm = parseInt(e.target.dataset.cpm, 10);
                    localStorage.setItem('rsvp_cpm', state.cpm);
                    updateSettingsUI();
                    if (state.isPlaying) restartTimer();
                });
            });

            // Settings Modal
            elements.openSettingsBtn.addEventListener('click', () => elements.settingsModal.classList.remove('hidden'));
            elements.closeSettingsBtn.addEventListener('click', () => elements.settingsModal.classList.add('hidden'));
            elements.saveSettingsBtn.addEventListener('click', () => {
                elements.settingsModal.classList.add('hidden');
                if (state.isPlaying) restartTimer();
            });

            // History Modal
            elements.openHistoryBtn.addEventListener('click', () => {
                renderHistoryList();
                elements.historyModal.classList.remove('hidden');
            });
            elements.closeHistoryBtn.addEventListener('click', () => elements.historyModal.classList.add('hidden'));
            elements.clearHistoryBtn.addEventListener('click', () => {
                state.history = [];
                localStorage.removeItem('rsvp_history');
                renderHistoryList();
            });

            // Font Toggle Buttons
            elements.fontGothicBtn.addEventListener('click', () => {
                state.fontFamily = 'gothic';
                localStorage.setItem('rsvp_font_family', 'gothic');
                updateSettingsUI();
            });
            elements.fontMinchoBtn.addEventListener('click', () => {
                state.fontFamily = 'mincho';
                localStorage.setItem('rsvp_font_family', 'mincho');
                updateSettingsUI();
            });

            // Sliders
            elements.cpmSlider.addEventListener('input', (e) => {
                state.cpm = parseInt(e.target.value, 10);
                elements.sliderSpeedVal.textContent = `${state.cpm} CPM`;
                elements.speedLabel.textContent = `${state.cpm} CPM`;
                localStorage.setItem('rsvp_cpm', state.cpm);
            });

            elements.fontSlider.addEventListener('input', (e) => {
                state.fontSize = parseInt(e.target.value, 10);
                elements.sliderFontVal.textContent = `${state.fontSize} px`;
                document.getElementById('rsvp-word-display').style.fontSize = `${state.fontSize}px`;
                localStorage.setItem('rsvp_font', state.fontSize);
            });

            // Chunk Mode Buttons
            document.querySelectorAll('.chunk-opt').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.chunk-opt').forEach(b => {
                        b.classList.remove('bg-accent/20', 'text-accent', 'border-accent/40');
                        b.classList.add('bg-gray-800', 'text-gray-300', 'border-transparent');
                    });
                    e.target.classList.remove('bg-gray-800', 'text-gray-300', 'border-transparent');
                    e.target.classList.add('bg-accent/20', 'text-accent', 'border-accent/40');

                    if (e.target.id === 'chunk-short') state.chunkMode = 'short';
                    else if (e.target.id === 'chunk-medium') state.chunkMode = 'medium';
                    else if (e.target.id === 'chunk-long') state.chunkMode = 'long';
                });
            });

            // Keyboard Shortcuts
            window.addEventListener('keydown', (e) => {
                if (!elements.settingsModal.classList.contains('hidden') || !elements.historyModal.classList.contains('hidden')) {
                    if (e.key === 'Escape') {
                        elements.settingsModal.classList.add('hidden');
                        elements.historyModal.classList.add('hidden');
                    }
                    return;
                }

                if (elements.readerStage.classList.contains('hidden')) return;

                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlayPause();
                } else if (e.code === 'ArrowLeft') {
                    skipPhrases(-5);
                } else if (e.code === 'ArrowRight') {
                    skipPhrases(5);
                } else if (e.code === 'ArrowUp') {
                    e.preventDefault();
                    state.cpm = Math.min(2500, state.cpm + 50);
                    localStorage.setItem('rsvp_cpm', state.cpm);
                    updateSettingsUI();
                    if (state.isPlaying) restartTimer();
                } else if (e.code === 'ArrowDown') {
                    e.preventDefault();
                    state.cpm = Math.max(100, state.cpm - 50);
                    localStorage.setItem('rsvp_cpm', state.cpm);
                    updateSettingsUI();
                    if (state.isPlaying) restartTimer();
                }
            });
        }

        function switchTab(type) {
            elements.tabUrl.classList.remove('active');
            elements.tabSample.classList.remove('active');
            elements.tabText.classList.remove('active');

            elements.viewUrl.classList.add('hidden');
            elements.viewSample.classList.add('hidden');
            elements.viewText.classList.add('hidden');

            if (type === 'url') {
                elements.tabUrl.classList.add('active');
                elements.viewUrl.classList.remove('hidden');
            } else if (type === 'sample') {
                elements.tabSample.classList.add('active');
                elements.viewSample.classList.remove('hidden');
            } else {
                elements.tabText.classList.add('active');
                elements.viewText.classList.remove('hidden');
            }
        }

        function showStatus(message, isError = false) {
            elements.statusMsg.textContent = message;
            elements.statusMsg.classList.remove('hidden', 'bg-red-900/40', 'text-red-300', 'bg-emerald-900/40', 'text-emerald-300');
            if (isError) {
                elements.statusMsg.classList.add('bg-red-900/40', 'text-red-300');
            } else {
                elements.statusMsg.classList.add('bg-emerald-900/40', 'text-emerald-300');
            }
        }

        async function handleUrlFetch(targetUrl = null) {
            const url = targetUrl || elements.novelUrlInput.value.trim();
            if (!url) {
                showStatus('URLを入力してください。', true);
                return;
            }

            showStatus('小説データを取得中...', false);
            elements.fetchBtn.disabled = true;

            try {
                localStorage.setItem('rsvp_last_url', url);
                state.currentUrl = url;

                // Proxy Strategy (AllOrigins -> CorsProxy fallback)
                let htmlContent = null;
                try {
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                    const res = await fetch(proxyUrl);
                    if (res.ok) {
                        const data = await res.json();
                        htmlContent = data.contents;
                    }
                } catch (e) {
                    console.warn('Primary proxy failed, trying fallback...', e);
                }

                if (!htmlContent) {
                    const fallbackProxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                    const res = await fetch(fallbackProxy);
                    if (!res.ok) throw new Error('ネットワーク応答エラーが発生しました');
                    htmlContent = await res.text();
                }

                if (!htmlContent) throw new Error('コンテンツの取得に失敗しました');

                // Parse HTML DOM
                const parserDOM = new DOMParser();
                const doc = parserDOM.parseFromString(htmlContent, 'text/html');

                let mainText = '';
                let novelTitle = '';
                let episodeTitle = '';
                let prevEpUrl = null;
                let nextEpUrl = null;

                // Detect Syosetu (小説家になろう)
                if (url.includes('syosetu.com')) {
                    const honbun = doc.querySelector('#novel_honbun') || doc.querySelector('.p-novel__body');
                    if (honbun) mainText = honbun.innerText;

                    const nTitle = doc.querySelector('.contents1 a') || doc.querySelector('.p-novel__title');
                    if (nTitle) novelTitle = nTitle.innerText;

                    const epTitle = doc.querySelector('.novel_subtitle') || doc.querySelector('.p-novel__subtitle');
                    if (epTitle) episodeTitle = epTitle.innerText;

                    const prevLink = doc.querySelector('a.novel_bn[rel="prev"]') || doc.querySelector('.p-novel__bn-prev');
                    const nextLink = doc.querySelector('a.novel_bn[rel="next"]') || doc.querySelector('.p-novel__bn-next');

                    if (prevLink && prevLink.getAttribute('href')) prevEpUrl = new URL(prevLink.getAttribute('href'), url).href;
                    if (nextLink && nextLink.getAttribute('href')) nextEpUrl = new URL(nextLink.getAttribute('href'), url).href;
                } 
                // Detect Kakuyomu (カクヨム)
                else if (url.includes('kakuyomu.jp')) {
                    const honbun = doc.querySelector('.widget-episodeBody') || doc.querySelector('.js-episode-body');
                    if (honbun) mainText = honbun.innerText;

                    const nTitle = doc.querySelector('#workTitle a') || doc.querySelector('.widget-workTitle-title');
                    if (nTitle) novelTitle = nTitle.innerText;

                    const epTitle = doc.querySelector('.widget-episodeTitle') || doc.querySelector('.episodeTitle');
                    if (epTitle) episodeTitle = epTitle.innerText;

                    const prevLink = doc.querySelector('#app-prveEpisodeLink') || doc.querySelector('.widget-episode-nav-item--prev a');
                    const nextLink = doc.querySelector('#app-nextEpisodeLink') || doc.querySelector('.widget-episode-nav-item--next a');

                    if (prevLink && prevLink.getAttribute('href')) prevEpUrl = new URL(prevLink.getAttribute('href'), url).href;
                    if (nextLink && nextLink.getAttribute('href')) nextEpUrl = new URL(nextLink.getAttribute('href'), url).href;
                }
                // General Scraper Fallback
                else {
                    const paragraphs = Array.from(doc.querySelectorAll('p')).map(p => p.innerText).filter(t => t.length > 10);
                    mainText = paragraphs.join('\n');
                    novelTitle = doc.title || 'Webノベル';
                    episodeTitle = '本文';
                }

                if (!mainText || mainText.trim().length === 0) {
                    throw new Error('本文テキストが見つかりませんでした。');
                }

                state.novelTitle = novelTitle || 'Web Novel';
                state.episodeTitle = episodeTitle || 'エピソード';
                state.prevUrl = prevEpUrl;
                state.nextUrl = nextEpUrl;

                saveToHistory(state.novelTitle, state.episodeTitle, url);
                processTextToRSVP(mainText);

            } catch (err) {
                console.error(err);
                showStatus(`取得エラー: ${err.message} (直接テキスト入力をお試しください)`, true);
            } finally {
                elements.fetchBtn.disabled = false;
            }
        }

        function handleDirectTextLoad() {
            const text = elements.directTextInput.value.trim();
            if (!text) {
                showStatus('テキストを入力してください。', true);
                return;
            }
            state.novelTitle = 'カスタムテキスト';
            state.episodeTitle = '直接入力本文';
            state.prevUrl = null;
            state.nextUrl = null;

            processTextToRSVP(text);
        }

        function processTextToRSVP(rawText) {
            // Clean up text format
            const cleanedText = rawText
                .replace(/\r\n/g, '\n')
                .replace(/\n+/g, '、')
                .replace(/\s+/g, ' ')
                .trim();

            let phrases = [];

            if (parser) {
                // BudouX phrase boundaries
                const rawChunks = parser.parse(cleanedText);

                if (state.chunkMode === 'short') {
                    phrases = rawChunks;
                } else if (state.chunkMode === 'medium') {
                    let current = '';
                    for (let chunk of rawChunks) {
                        current += chunk;
                        if (current.length >= 4 || '。！？!?\n'.includes(chunk.slice(-1))) {
                            phrases.push(current);
                            current = '';
                        }
                    }
                    if (current) phrases.push(current);
                } else {
                    let current = '';
                    for (let chunk of rawChunks) {
                        current += chunk;
                        if (current.length >= 8 || '。！？!?\n'.includes(chunk.slice(-1))) {
                            phrases.push(current);
                            current = '';
                        }
                    }
                    if (current) phrases.push(current);
                }
            } else {
                phrases = cleanedText.match(/.{1,5}/g) || [cleanedText];
            }

            state.phrases = phrases.filter(p => p.trim().length > 0);
            state.currentIndex = 0;

            // Show Reader View
            elements.inputCard.classList.add('hidden');
            elements.readerStage.classList.remove('hidden');
            elements.novelTitle.textContent = state.novelTitle;
            elements.episodeTitle.textContent = state.episodeTitle;

            elements.prevEpBtn.disabled = !state.prevUrl;
            elements.nextEpBtn.disabled = !state.nextUrl;

            renderCurrentPhrase();
            updateProgress();
            showStatus('', false);
            elements.statusMsg.classList.add('hidden');
        }

        function renderCurrentPhrase() {
            if (state.phrases.length === 0) return;

            const phrase = state.phrases[state.currentIndex];
            if (!phrase) return;

            // Calculate ORP pivot index (approx center)
            const orpIndex = Math.floor(phrase.length / 2);

            const leftPart = phrase.slice(0, orpIndex);
            const pivotChar = phrase[orpIndex] || '';
            const rightPart = phrase.slice(orpIndex + 1);

            elements.orpLeft.textContent = leftPart;
            elements.orpPivot.textContent = pivotChar;
            elements.orpRight.textContent = rightPart;
        }

        function togglePlayPause() {
            if (state.isPlaying) {
                pause();
            } else {
                play();
            }
        }

        function play() {
            if (state.phrases.length === 0) return;
            if (state.currentIndex >= state.phrases.length - 1) {
                state.currentIndex = 0;
            }
            state.isPlaying = true;
            elements.playBtnIcon.className = 'ph-bold ph-pause text-2xl';
            showPauseOverlay(false);
            startTimer();
        }

        function pause() {
            state.isPlaying = false;
            elements.playBtnIcon.className = 'ph-bold ph-play text-2xl';
            if (state.timer) clearTimeout(state.timer);
            showPauseOverlay(true);
        }

        function showPauseOverlay(isPaused) {
            if (isPaused) {
                elements.pauseIcon.className = 'ph-fill ph-pause-circle text-6xl text-accent';
                elements.pauseOverlay.style.opacity = '1';
                setTimeout(() => {
                    elements.pauseOverlay.style.opacity = '0';
                }, 500);
            } else {
                elements.pauseIcon.className = 'ph-fill ph-play-circle text-6xl text-accent';
                elements.pauseOverlay.style.opacity = '1';
                setTimeout(() => {
                    elements.pauseOverlay.style.opacity = '0';
                }, 350);
            }
        }

        function startTimer() {
            if (state.timer) clearTimeout(state.timer);

            const currentPhrase = state.phrases[state.currentIndex] || '';
            const charCount = currentPhrase.length || 1;

            // Base delay = (60,000 ms / CPM) * charCount
            const msPerChar = 60000 / state.cpm;
            let delay = msPerChar * charCount;

            // Slight pauses for punctuation endings
            if (/[。！？!?]/.test(currentPhrase)) {
                delay *= 1.45;
            } else if (/[、,}]/.test(currentPhrase)) {
                delay *= 1.2;
            }

            delay = Math.max(90, delay);

            state.timer = setTimeout(() => {
                if (!state.isPlaying) return;

                if (state.currentIndex < state.phrases.length - 1) {
                    state.currentIndex++;
                    renderCurrentPhrase();
                    updateProgress();
                    startTimer();
                } else {
                    pause();
                    renderCurrentPhrase();
                    updateProgress();

                    if (state.nextUrl) {
                        showCustomConfirm('話が終了しました。次のエピソードに移動しますか？', () => {
                            navigateEpisode(state.nextUrl);
                        });
                    }
                }
            }, delay);
        }

        function restartTimer() {
            if (state.isPlaying) {
                startTimer();
            }
        }

        function skipPhrases(count) {
            state.currentIndex = Math.max(0, Math.min(state.phrases.length - 1, state.currentIndex + count));
            renderCurrentPhrase();
            updateProgress();
            if (state.isPlaying) restartTimer();
        }

        function updateProgress() {
            const total = state.phrases.length;
            const current = state.currentIndex + 1;
            const percentage = total > 0 ? (current / total) * 100 : 0;

            elements.progressBar.style.width = `${percentage}%`;
            elements.progressText.textContent = `フレーズ: ${current} / ${total}`;

            let remainingChars = 0;
            for (let i = state.currentIndex; i < total; i++) {
                remainingChars += (state.phrases[i] || '').length;
            }
            const remainingMinutes = (remainingChars / state.cpm).toFixed(1);
            elements.timeRemaining.textContent = `残り: 約${remainingMinutes}分`;
        }

        function navigateEpisode(targetUrl) {
            if (!targetUrl) return;
            pause();
            elements.novelUrlInput.value = targetUrl;
            handleUrlFetch(targetUrl);
        }

        function resetToInput() {
            pause();
            elements.readerStage.classList.add('hidden');
            elements.inputCard.classList.remove('hidden');
        }

        function saveToHistory(novelTitle, episodeTitle, url) {
            if (!url) return;
            // Remove duplicates
            state.history = state.history.filter(item => item.url !== url);
            state.history.unshift({
                novelTitle,
                episodeTitle,
                url,
                timestamp: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            });
            if (state.history.length > 20) state.history.pop();
            localStorage.setItem('rsvp_history', JSON.stringify(state.history));
        }

        function renderHistoryList() {
            elements.historyList.innerHTML = '';
            if (state.history.length === 0) {
                elements.historyList.innerHTML = `<div class="text-xs text-gray-500 text-center py-6">読書履歴はありません</div>`;
                return;
            }

            state.history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'p-3 rounded-xl bg-gray-900/80 hover:bg-gray-800/90 border border-gray-800 text-left transition-all flex items-center justify-between cursor-pointer group';
                div.innerHTML = `
                    <div class="overflow-hidden pr-2">
                        <div class="text-xs font-bold text-gray-200 group-hover:text-accent truncate transition-colors">${escapeHtml(item.novelTitle)}</div>
                        <div class="text-[11px] text-gray-400 truncate mt-0.5">${escapeHtml(item.episodeTitle)}</div>
                        <div class="text-[10px] text-gray-500 mt-1">${item.timestamp}</div>
                    </div>
                    <i class="ph-bold ph-caret-right text-gray-500 group-hover:text-accent text-base shrink-0"></i>
                `;
                div.addEventListener('click', () => {
                    elements.historyModal.classList.add('hidden');
                    elements.novelUrlInput.value = item.url;
                    switchTab('url');
                    handleUrlFetch(item.url);
                });
                elements.historyList.appendChild(div);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Custom Modal Dialog Helper
        function showCustomConfirm(msg, onConfirm) {
            const dialog = document.getElementById('custom-dialog');
            const dialogMsg = document.getElementById('dialog-msg');
            const cancelBtn = document.getElementById('dialog-cancel-btn');
            const confirmBtn = document.getElementById('dialog-confirm-btn');

            dialogMsg.textContent = msg;
            cancelBtn.classList.remove('hidden');
            dialog.classList.remove('hidden');

            const handleConfirm = () => {
                dialog.classList.add('hidden');
                confirmBtn.removeEventListener('click', handleConfirm);
                cancelBtn.removeEventListener('click', handleCancel);
                if (onConfirm) onConfirm();
            };

            const handleCancel = () => {
                dialog.classList.add('hidden');
                confirmBtn.removeEventListener('click', handleConfirm);
                cancelBtn.removeEventListener('click', handleCancel);
            };

            confirmBtn.addEventListener('click', handleConfirm);
            cancelBtn.addEventListener('click', handleCancel);
        }
    </script>
</body>
